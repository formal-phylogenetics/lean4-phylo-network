# The papers of the collection, one [[paper]] per repository to be, grouped by method family.
#
# Started on 2026-11-21. Titles, authors and years are as first listed: each formalization records
# the exact citation in its Phase 0, and corrects the entry here.
#
# Fields of a paper:
#   id          the repository is lean4-<id>: the method's name in lower case when the paper names
#               one, otherwise first author and year, with a keyword when two papers would share it
#   family      the [[family]] it belongs to (each paper is in exactly one)
#   order       its place in the family
#   short       the method's name, when it has one
#   kind        "theory" (an identifiability, characterization or reconstruction
#               theorem), "theory+algorithm", or "method"
#   root        the Lean package, module root and namespace (lean4-phylogenetics' docs/CONVENTIONS.md)
#   status      "todo", "partial" (some results are formalized elsewhere: see covered_by),
#               "in-progress" (its repository exists), or "formalized"
#   repo        only when the repository is not named lean4-<id>
#   commit      for a formalized paper: the commit that other repositories require
#   uses        other hubs whose library its formalization requires (lean4-tob: the tree of blobs)
#   builds_on   ids of papers, of any hub's catalog, whose results its proofs use. Only what is known
#               before the paper's inventory; its Phase 1 completes the list here
#   covered_by  what is already formalized, and where
#   note        anything else

[[family]]
id = 1
title = "Quartet- and quintet-based statistical network inference"
priority = "highest"

[[family]]
id = 2
title = "Semi-directed reconstruction from quartets, quarnets and quinnets"

[[family]]
id = 3
title = "Rooted reconstruction from triplets, trinets, clusters and LCA constraints"

[[family]]
id = 4
title = "Reconstruction and reconciliation from multiple input trees"

[[family]]
id = 5
title = "Model-based likelihood, Bayesian and sequence-data inference"

